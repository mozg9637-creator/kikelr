name: Build Unsigned IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build iOS App and generate IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
          xcodebuild -version

      - name: Build app (Unsigned)
        run: |
          xcodebuild -project PatientPlanner.xcodeproj \
                     -scheme PatientPlanner \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build

      - name: Package IPA
        run: |
          mkdir -p Payload
          # Переносим скомпилированное приложение в папку Payload для архивации в ipa
          cp -R ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/PatientPlanner.app Payload/
          zip -r PatientPlanner-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PatientPlanner-unsigned-ipa
          path: PatientPlanner-unsigned.ipa
